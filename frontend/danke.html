<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vielen Dank – {{site.name}}</title>
  <!-- Bestätigungsseite nach dem Absenden ohne JavaScript (Weiterleitung vom Backend) -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f2a4a">
  {{> head-icons}}
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sections.css">
  {{#if demo}}
  <link rel="stylesheet" href="css/demo.css">
  {{/if}}
</head>
<body>
  {{> demo-banner}}
  <main class="section thanks">
    <div class="container">
      <div class="form-success">
        <h1 class="form-success__title">Vielen Dank!</h1>
        <p>Ihre Anfrage ist bei uns angekommen. Wir melden uns {{site.responseTime}}.</p>
        <p class="contact__small">Eilig? Rufen Sie uns an: <a {{{callHref site.phone.tel}}}>{{site.phone.display}}</a></p>
        <a class="btn btn--primary" href="./">Zurück zur Startseite</a>
      </div>
    </div>
  </main>
</body>
</html>
